    <!-- Evita el parpadeo blanco: aplica el tema guardado antes de pintar -->
    <script>
      try {
        var t = localStorage.getItem('organiza:theme') || 'auto';
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
